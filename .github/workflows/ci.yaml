name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Aligned runner with Python 3.9 to prevent legacy Tornado compilation loops
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run application tests
        run: python tests/test.py

  build-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tradebyte-app:${{ github.sha }} .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: tradebyte-app:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "0.55.2"

      - name: Terraform format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive || true

      - name: Terragrunt validate
        working-directory: infra
        run: terragrunt init -backend=false && terragrunt validate

  integration:
    runs-on: ubuntu-latest
    needs: [test, build-scan, terraform]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Create Kind cluster with custom settings to support Nginx Ingress controllers natively
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: tradebyte
          config: |
            kind: Cluster
            apiVersion: kind.x-k8s.io/v1alpha4
            nodes:
            - role: control-plane
              kubeadmConfigPatches:
              - |
                kind: InitConfiguration
                nodeRegistration:
                  kubeletExtraArgs:
                    node-labels: "ingress-ready=true"
              extraPortMappings:
              - containerPort: 80
                hostPort: 80
                protocol: TCP

      # Bridge context differences so infra/main.tf finds its expected "minikube" context string
      - name: Set up cluster profile context mapping
        run: |
          kubectl config set-context minikube --cluster=kind-tradebyte --user=kind-tradebyte --namespace=default
          kubectl config use-context minikube

      # Explicitly provision the Ingress routing layer inside Kind
      - name: Install Nginx Ingress Controller
        run: |
          kubectl apply -f https://githubusercontent.com
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      # Installs the missing metrics infrastructure required for HPA validation
      - name: Deploy Metrics Server
        run: |
          kubectl apply -f https://github.com
          kubectl wait --namespace kube-system \
            --for=condition=ready pod \
            --selector=k8s-app=metrics-server \
            --timeout=120s
          kubectl patch deployment metrics-server -n kube-system --type='json' -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
          kubectl rollout restart deployment metrics-server -n kube-system
          kubectl rollout status deployment metrics-server -n kube-system --timeout=60s

      - name: Build image
        run: docker build -t tradebyte-app:${{ github.sha }} .

      - name: Load image into kind
        run: kind load docker-image tradebyte-app:${{ github.sha }} --name tradebyte

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "0.55.2"

      # STAGE 1: Generate the speculative execution blueprint file
      - name: Terragrunt Plan
        working-directory: infra
        run: |
          terragrunt init -backend=false
          terragrunt plan \
            -var="image=tradebyte-app:${{ github.sha }}" \
            -var="kube_context=minikube" \
            -out=tfplan

      # STAGE 2: Apply the targeted blueprint deterministically
      - name: Terragrunt Apply
        working-directory: infra
        run: |
          terragrunt apply --auto-approve tfplan

      - name: Wait for application
        run: |
          kubectl rollout status deployment/redis -n tradebyte --timeout=180s
          kubectl rollout status deployment/tradebyte-app -n tradebyte --timeout=180s

      - name: Verify replicas
        run: test "$(kubectl get deployment tradebyte-app -n tradebyte -o jsonpath='{.status.readyReplicas}')" -ge 3

      - name: Verify HPA
        run: |
          sleep 15
          kubectl get hpa -n tradebyte
