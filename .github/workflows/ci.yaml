name: CI
on:
  pull_request:
  push:
    branches:
      - master
      - feature/k8s-production-setup
permissions:
  contents: read
jobs:
  test:
    name: Application Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run application tests
        run: |
          python tests/test.py

  build-scan:
    name: Build and Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag tradebyte-app:${{ github.sha }} \
            .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tradebyte-app:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "0.91.1"

      - name: Terraform format check
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive

      - name: Terragrunt initialization
        working-directory: infra
        run: |
          terragrunt init -backend=false

      - name: Terragrunt validation
        working-directory: infra
        run: |
          terragrunt validate

  integration:
    name: Kubernetes Integration
    runs-on: ubuntu-latest
    needs:
      - test
      - build-scan
      - terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: tradebyte

      - name: Configure Kubernetes context
        run: |
          kubectl config use-context kind-tradebyte
          kubectl cluster-info

      - name: Install NGINX Ingress Controller
        run: |
          kubectl apply \
            -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.13.2/deploy/static/provider/kind/deploy.yaml

          kubectl wait \
            --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      - name: Install Metrics Server
        run: |
          kubectl apply \
            -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml

          kubectl patch deployment metrics-server \
            -n kube-system \
            --type='json' \
            -p='[
              {
                "op": "add",
                "path": "/spec/template/spec/containers/0/args/-",
                "value": "--kubelet-insecure-tls"
              }
            ]'

          kubectl rollout status \
            deployment/metrics-server \
            -n kube-system \
            --timeout=180s

      - name: Build Docker image
        run: |
          docker build \
            --tag tradebyte-app:${{ github.sha }} \
            .

      - name: Load image into Kind
        run: |
          kind load docker-image \
            tradebyte-app:${{ github.sha }} \
            --name tradebyte

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: "0.91.1"

      - name: Terragrunt Init
        working-directory: infra
        run: |
          terragrunt init -backend=false

      - name: Terragrunt Plan
        working-directory: infra
        run: |
          terragrunt plan \
            -var="image=tradebyte-app:${{ github.sha }}" \
            -var="kube_context=kind-tradebyte" \
            -out=tfplan

      - name: Terragrunt Apply
        working-directory: infra
        run: |
          terragrunt apply --auto-approve tfplan

      - name: Verify Vault
        run: |
          echo "Vault pods:"
          kubectl get pods -n tradebyte -l app.kubernetes.io/name=vault

          echo
          echo "Vault Agent Injector:"
          kubectl get pods -n tradebyte -l app.kubernetes.io/name=vault-agent-injector

          echo
          echo "Vault webhook:"
          kubectl get mutatingwebhookconfigurations | grep -i vault

      - name: Verify Redis
        run: |
          kubectl rollout status \
            deployment/redis \
            -n tradebyte \
            --timeout=180s

      - name: Wait for TradeByte application
        run: |
          kubectl rollout status \
            deployment/tradebyte-app \
            -n tradebyte \
            --timeout=300s

      - name: Verify Vault secret injection
        run: |
          POD=$(kubectl get pods \
            -n tradebyte \
            -l app=tradebyte-app \
            -o jsonpath='{.items[0].metadata.name}')

          echo "TradeByte pod: $POD"

          echo
          echo "Containers:"
          kubectl get pod "$POD" \
            -n tradebyte \
            -o jsonpath='{.spec.containers[*].name}'

          echo
          echo
          echo "Volumes:"
          kubectl get pod "$POD" \
            -n tradebyte \
            -o jsonpath='{.spec.volumes[*].name}'

          echo
          echo
          echo "Checking injected secret..."

          kubectl exec \
            -n tradebyte \
            "$POD" \
            -c app \
            -- sh -c '
              test -f /vault/secrets/config.env
            '

          echo "Vault secret successfully injected."

      - name: Verify minimum replicas
        run: |
          READY=$(kubectl get deployment tradebyte-app \
            -n tradebyte \
            -o jsonpath='{.status.readyReplicas}')

          echo "Ready replicas: ${READY:-0}"

          test "${READY:-0}" -ge 3

      - name: Verify HPA
        run: |
          kubectl get hpa \
            -n tradebyte \
            tradebyte-app

          kubectl describe hpa \
            -n tradebyte \
            tradebyte-app

      - name: Show deployment status
        if: always()
        run: |
          echo "================ PODS ================"
          kubectl get pods -n tradebyte -o wide || true

          echo
          echo "================ SERVICES ================"
          kubectl get svc -n tradebyte || true

          echo
          echo "================ DEPLOYMENTS ================"
          kubectl get deployments -n tradebyte || true

          echo
          echo "================ HPA ================"
          kubectl get hpa -n tradebyte || true

          echo
          echo "================ PDB ================"
          kubectl get pdb -n tradebyte || true

          echo
          echo "================ INGRESS ================"
          kubectl get ingress -n tradebyte || true

      - name: Application logs
        if: failure()
        run: |
          kubectl logs \
            -n tradebyte \
            -l app=tradebyte-app \
            -c app \
            --tail=200 \
            || true

      - name: Vault logs
        if: failure()
        run: |
          kubectl logs \
            -n tradebyte \
            -l app.kubernetes.io/name=vault \
            --tail=200 \
            || true

          echo
          echo "Vault injector logs:"

          kubectl logs \
            -n tradebyte \
            -l app.kubernetes.io/name=vault-agent-injector \
            --tail=200 \
            || true